# Plantilla de nginx para la SPA (M3.1-S09). El contenedor oficial de nginx la procesa al arrancar (/etc/nginx/templates/*.template -> envsubst) y SOLO sustituye
# las variables de entorno definidas: aquí ${API_ORIGIN} (origen de la Web API, p. ej. http://localhost:5080; vacío si la API vive en el mismo origen que la SPA).
# $uri y demás variables propias de nginx no se tocan. Ver docs/AUTH_SECURITY_REVIEW.md («Cabeceras y CSP») para la justificación de cada directiva.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy ESTRICTA: nada se carga si no se permite expresamente (default-src 'none').
    #  script-src 'self'            solo el bundle de Vite (sin inline, sin eval, sin CDN).
    #  style-src 'self'             solo la hoja de estilos empaquetada; los style={{...}} de React se aplican por CSSOM (no los bloquea la CSP).
    #  img-src 'self' data: blob: API_ORIGIN   data: = SVG de previews (svgToDataUrl), blob: = miniatura del archivo elegido y rasterizado del export, API_ORIGIN = <img src> de imágenes del servidor.
    #  font-src 'self'              (la app no carga fuentes externas).
    #  connect-src 'self' API_ORIGIN   fetch a la Web API (la cookie de sesión viaja con credentials: include). Es lo único que puede recibir datos del usuario.
    #  base-uri 'self', form-action 'self', frame-ancestors 'none', object-src 'none'   sin <base> ajeno, sin formularios hacia fuera, sin ser embebida, sin plugins.
    # (sin 'upgrade-insecure-requests' a propósito: este contenedor se prueba por http://localhost; añádala en el proxy que termina TLS.)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: ${API_ORIGIN}; font-src 'self'; connect-src 'self' ${API_ORIGIN}; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # NO 'no-referrer': con esa política el navegador envía "Origin: null" en las peticiones del mismo origen y el CsrfGuard de la API respondería 403 (S08).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Strict-Transport-Security lo emite quien termina TLS (el proxy de producción); este contenedor habla http dentro de la red privada.

    # NOTA: los add_header se HEREDAN a las location solo si estas no declaran los suyos; por eso no hay add_header dentro de location.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
