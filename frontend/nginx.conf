server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Revalidate the entry page after releases. Keep this at server scope so
    # locations continue to inherit any existing security headers.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
