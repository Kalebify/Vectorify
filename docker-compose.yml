# Este compose es la pila de DESARROLLO local (M3.1-S09): Development + Auth__Mode=Development explícitos (sin login, usuario fijo), contraseña de
# Postgres de ejemplo y puertos publicados SOLO en el loopback del anfitrión (BIND_ADDRESS=127.0.0.1 por defecto; ponga BIND_ADDRESS=0.0.0.0 únicamente si
# necesita abrirla a su red local, sabiendo que en modo Development cualquiera que llegue a la API actúa como el usuario de desarrollo).
# NO es una plantilla de producción: ahí se usan la imagen del backend con sus defaults (Production + Authenticated), secretos reales por entorno y un proxy con TLS
# delante (ver docs/AUTH_SECURITY_REVIEW.md).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vectorify}
      POSTGRES_USER: ${POSTGRES_USER:-vectorify}
      # Contraseña de DESARROLLO publicada en el repositorio a propósito: la API se niega a arrancar fuera de Development/Testing/Test si la cadena de
      # conexión la usa (KnownDevelopmentSecrets). Cámbiela en cualquier despliegue real con POSTGRES_PASSWORD.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vectorify_dev_password}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volumen nombrado propio (mismo criterio que vectorify_backend_data para
      # App_Data): sin esto, los datos de Postgres se pierden en cada
      # `docker compose down`/restart del container.
      - vectorify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vectorify} -d ${POSTGRES_DB:-vectorify}"]
      interval: 5s
      timeout: 3s
      retries: 10

  python-engine:
    build:
      context: ./services/python-engine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PYTHON_PORT:-8001}:8000"
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-vectorify-python-engine}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-5080}:8080"
    volumes:
      # Los originales subidos (LocalFileStorage) y los sidecars de metadata de
      # proyecto/threshold/vectorización (PersistentProjectRegistry,
      # PersistentThresholdConfigRegistry, PersistentVectorVersionRegistry) viven
      # todos bajo subcarpetas de App_Data dentro del contenedor; al montar la raíz
      # App_Data entera, este único volumen ya cubre las tres sin necesidad de
      # declarar un volumen por subcarpeta. Sin este volumen se pierden en cada
      # `docker compose down`/restart.
      - vectorify_backend_data:/app/App_Data
      # Key ring de Data Protection (M3.1-S04): con él se cifra la cookie de sesión. Volumen PROPIO y separado de App_Data a propósito:
      # es un SECRETO (quien lo lee puede forjar sesiones) con otra política de acceso y de respaldo que los datos de usuario
      # (scripts/backup.* NO lo incluyen; ver docs/AUTH_SESSION_LIFECYCLE.md). Si se pierde, todas las sesiones dejan de valer
      # (la gente vuelve a iniciar sesión); nada más se rompe. Sin este volumen, cada recreación del contenedor las invalidaría.
      - vectorify_dataprotection_keys:/var/lib/vectorify/dataprotection-keys
    environment:
      # Modo de DESARROLLO explícito (M3.1-S09): la imagen del backend ya NO arranca por defecto en Development (su default es Production + Authenticated), así que este
      # compose lo pide aquí. Para probar la autenticación real: AUTH_MODE=Authenticated (el entorno puede seguir en Development).
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      # Nombre del servicio en la red de docker-compose, no localhost.
      PythonEngine__BaseUrl: ${PYTHON_ENGINE_INTERNAL_URL:-http://python-engine:8000}
      PythonEngine__TimeoutSeconds: ${PYTHON_ENGINE_TIMEOUT_SECONDS:-5}
      # Orígenes del NAVEGADOR autorizados a llamar a la Web API (donde se sirve React).
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Identidad (M3.1-S02, ADR docs/ADR_AUTH_MVP31.md). Valores NO secretos. Mientras no exista login en la UI
      # (S03/S05) el compose de desarrollo sigue sirviendo la API con el usuario de desarrollo: Auth__Mode=Development,
      # que SOLO se permite con ASPNETCORE_ENVIRONMENT=Development|Testing|Test (en otro entorno la API NO arranca).
      # Para un despliegue real: AUTH_MODE=Authenticated, AUTH_COOKIE_NAME=__Host-vectorify.session y
      # AUTH_COOKIE_SECURE_POLICY=Always (ver .env.example).
      Auth__Mode: ${AUTH_MODE:-Development}
      Auth__Cookie__Name: ${AUTH_COOKIE_NAME:-vectorify.session}
      Auth__Cookie__SecurePolicy: ${AUTH_COOKIE_SECURE_POLICY:-SameAsRequest}
      Auth__Password__MinLength: ${AUTH_PASSWORD_MIN_LENGTH:-12}
      # Sesión (M3.1-S04, ver docs/AUTH_SESSION_LIFECYCLE.md). Lifetime = inactividad máxima (deslizante); RememberMeLifetime = tope
      # ABSOLUTO de «recordarme»; RevalidationInterval = ventana máxima en que una sesión revocada sigue viva en otro navegador.
      Auth__Cookie__Lifetime: ${AUTH_COOKIE_LIFETIME:-08:00:00}
      Auth__Cookie__RememberMeLifetime: ${AUTH_COOKIE_REMEMBER_ME_LIFETIME:-30.00:00:00}
      Auth__Session__RevalidationInterval: ${AUTH_SESSION_REVALIDATION_INTERVAL:-00:05:00}
      Auth__Session__ClockSkew: ${AUTH_SESSION_CLOCK_SKEW:-00:00:30}
      # Ruta DENTRO del contenedor del key ring (coincide con el volumen montado arriba; no la cambies sin cambiar el volumen).
      Auth__DataProtection__KeysPath: /var/lib/vectorify/dataprotection-keys
      # Recuperación de acceso y verificación de correo (M3.1-S08, ver docs/AUTH_RECOVERY.md). Por defecto el correo está APAGADO
      # (Disabled): forgot/resend responden 202 pero no envían nada. Log (solo Development) escribe el enlace en el log del backend;
      # Smtp envía de verdad. PublicBaseUrl = dónde se sirve la SPA (debe figurar en CORS_ALLOWED_ORIGINS) y NUNCA se deriva de la request.
      # La contraseña SMTP (AUTH_EMAIL_SMTP_PASSWORD) es un SECRETO: solo por entorno o .env local, jamás en el repositorio.
      Auth__Email__Mode: ${AUTH_EMAIL_MODE:-Disabled}
      Auth__Email__PublicBaseUrl: ${AUTH_EMAIL_PUBLIC_BASE_URL:-}
      Auth__Email__FromAddress: ${AUTH_EMAIL_FROM_ADDRESS:-}
      Auth__Email__FromName: ${AUTH_EMAIL_FROM_NAME:-Vectorify}
      Auth__Email__Smtp__Host: ${AUTH_EMAIL_SMTP_HOST:-}
      Auth__Email__Smtp__Port: ${AUTH_EMAIL_SMTP_PORT:-587}
      Auth__Email__Smtp__Security: ${AUTH_EMAIL_SMTP_SECURITY:-StartTls}
      Auth__Email__Smtp__UserName: ${AUTH_EMAIL_SMTP_USERNAME:-}
      Auth__Email__Smtp__Password: ${AUTH_EMAIL_SMTP_PASSWORD:-}
      Auth__Tokens__PasswordResetLifetime: ${AUTH_TOKENS_PASSWORD_RESET_LIFETIME:-01:00:00}
      Auth__Tokens__EmailConfirmationLifetime: ${AUTH_TOKENS_EMAIL_CONFIRMATION_LIFETIME:-1.00:00:00}
      Auth__RequireConfirmedEmail: ${AUTH_REQUIRE_CONFIRMED_EMAIL:-false}
      Auth__RateLimit__IpPermitLimit: ${AUTH_RATE_LIMIT_IP_PERMIT_LIMIT:-20}
      Auth__RateLimit__IpWindow: ${AUTH_RATE_LIMIT_IP_WINDOW:-00:15:00}
      Auth__RateLimit__AddressSendPermitLimit: ${AUTH_RATE_LIMIT_ADDRESS_SEND_PERMIT_LIMIT:-5}
      Auth__RateLimit__AddressVerifyPermitLimit: ${AUTH_RATE_LIMIT_ADDRESS_VERIFY_PERMIT_LIMIT:-10}
      Auth__RateLimit__AddressWindow: ${AUTH_RATE_LIMIT_ADDRESS_WINDOW:-01:00:00}
      # Límites de login y registro (M3.1-S09, ver docs/AUTH_SECURITY_REVIEW.md): por IP y por dirección hasheada; 429 + Retry-After al excederse.
      Auth__RateLimit__LoginIpPermitLimit: ${AUTH_RATE_LIMIT_LOGIN_IP_PERMIT_LIMIT:-20}
      Auth__RateLimit__LoginIpWindow: ${AUTH_RATE_LIMIT_LOGIN_IP_WINDOW:-00:15:00}
      Auth__RateLimit__LoginAddressPermitLimit: ${AUTH_RATE_LIMIT_LOGIN_ADDRESS_PERMIT_LIMIT:-10}
      Auth__RateLimit__LoginAddressWindow: ${AUTH_RATE_LIMIT_LOGIN_ADDRESS_WINDOW:-00:15:00}
      Auth__RateLimit__RegisterIpPermitLimit: ${AUTH_RATE_LIMIT_REGISTER_IP_PERMIT_LIMIT:-10}
      Auth__RateLimit__RegisterIpWindow: ${AUTH_RATE_LIMIT_REGISTER_IP_WINDOW:-01:00:00}
      Auth__RateLimit__RegisterAddressPermitLimit: ${AUTH_RATE_LIMIT_REGISTER_ADDRESS_PERMIT_LIMIT:-5}
      Auth__RateLimit__RegisterAddressWindow: ${AUTH_RATE_LIMIT_REGISTER_ADDRESS_WINDOW:-01:00:00}
      # Proxy de confianza (M3.1-S09): APAGADO por defecto (X-Forwarded-* de un cliente se ignora). Detrás de un proxy/TLS: AUTH_FORWARDED_HEADERS_ENABLED=true y la IP del
      # proxy (KNOWN_PROXIES) o su red (KNOWN_NETWORKS, p. ej. la red de docker 172.16.0.0/12). Sin al menos una de las dos, la API no arranca.
      Auth__ForwardedHeaders__Enabled: ${AUTH_FORWARDED_HEADERS_ENABLED:-false}
      Auth__ForwardedHeaders__KnownProxies: ${AUTH_FORWARDED_HEADERS_KNOWN_PROXIES:-}
      Auth__ForwardedHeaders__KnownNetworks: ${AUTH_FORWARDED_HEADERS_KNOWN_NETWORKS:-}
      Auth__ForwardedHeaders__ForwardLimit: ${AUTH_FORWARDED_HEADERS_FORWARD_LIMIT:-1}
      # HSTS (M3.1-S09): solo se emite fuera de Development y sobre https (visto tras ForwardedHeaders).
      Auth__Hsts__MaxAge: ${AUTH_HSTS_MAX_AGE:-180.00:00:00}
      Auth__Hsts__IncludeSubDomains: ${AUTH_HSTS_INCLUDE_SUBDOMAINS:-false}
      # Nombre del servicio "postgres" en la red de docker-compose, no localhost ni el
      # puerto publicado en el host. Nunca hardcodeado -- viene de variables de entorno
      # con el mismo criterio que PythonEngine__BaseUrl (ver .env.example).
      Postgres__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-vectorify};Username=${POSTGRES_USER:-vectorify};Password=${POSTGRES_PASSWORD:-vectorify_dev_password}"
    depends_on:
      # Postgres tarda en aceptar conexiones incluso después de "started": hay que
      # esperar a que su healthcheck (pg_isready) reporte healthy, no alcanza con un
      # depends_on simple. python-engine conserva el comportamiento previo (solo
      # "started", no tiene condición explícita).
      python-engine:
        condition: service_started
      postgres:
        condition: service_healthy

  # Sumidero de correo SOLO para desarrollo/verificación manual de la recuperación de acceso (M3.1-S08). No arranca por defecto:
  #   docker compose --profile mail-sink up -d
  # y, para que el backend le hable: AUTH_EMAIL_MODE=Smtp AUTH_EMAIL_SMTP_HOST=mailpit AUTH_EMAIL_SMTP_PORT=1025
  # AUTH_EMAIL_SMTP_SECURITY=None AUTH_EMAIL_FROM_ADDRESS=no-reply@vectorify.local AUTH_EMAIL_PUBLIC_BASE_URL=<origen de la SPA>.
  # Mailpit guarda los mensajes en memoria y los muestra en http://localhost:${MAILPIT_UI_PORT:-8025}; no entrega nada a Internet.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail-sink"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"

  frontend:
    build:
      context: ./frontend
      args:
        # URL que usa el NAVEGADOR (fuera de la red docker), por eso apunta al
        # puerto publicado en el host, no al nombre del servicio "backend".
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5080}
    environment:
      # Origen de la API que la CSP del frontend permite en connect-src/img-src (M3.1-S09; nginx lo sustituye al arrancar). Debe coincidir con el origen de
      # VITE_API_BASE_URL (un origen, sin ruta). Vacío = la API vive en el mismo origen que la SPA (proxy).
      API_ORIGIN: ${API_ORIGIN:-${VITE_API_BASE_URL:-http://localhost:5080}}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  vectorify_backend_data:
  vectorify_postgres_data:
  vectorify_dataprotection_keys:
